name: myvidcomp_gui
description: "MyVidComp: shrink your video library without losing what matters."
publish_to: 'none'

version: 0.1.4+5

environment:
  sdk: ^3.12.2

dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  # Android draws a launcher icon inside a shape of the launcher's choosing and
  # keeps only the middle of it, so the artwork is inset rather than passed
  # straight through, and the transparency behind it is filled in.
  android: "ic_launcher"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 18
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
