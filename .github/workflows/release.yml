name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.2"
  # Pinned rather than BtbN's rolling "latest" tag, so re-running this workflow
  # for the same version produces the same bundle and the same checksums.
  FFMPEG_X64_URL: "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-05-13-10/ffmpeg-n9.0.1-26-g5c8e7e2433-win64-gpl-9.0.zip"
  FFMPEG_ARM64_URL: "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-05-13-10/ffmpeg-n9.0.1-26-g5c8e7e2433-winarm64-gpl-9.0.zip"

jobs:
  check-version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: The tag and the crate agree
        id: read
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Crate version: $version"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match crate version $version."
              exit 1
            fi
          fi

  windows:
    name: Windows (${{ matrix.platform }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        # Flutter builds a Windows application only for the machine it runs on,
        # so each package is built on a runner of its own architecture.
        include:
          - platform: x64
            os: windows-2025
            ffmpeg: FFMPEG_X64_URL
          - platform: arm64
            os: windows-11-arm
            ffmpeg: FFMPEG_ARM64_URL
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.platform }}

      - uses: subosito/flutter-action@v2
        if: matrix.platform == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The published Windows archive is x64 and carries an x64 Dart, which
      # makes the tool believe it is on an x64 machine and build an x64
      # application. A clone fetches the halves that match the machine it is
      # sitting on, which is what lets an Arm runner build an Arm package.
      - name: Install Flutter for Arm
        if: matrix.platform == 'arm64'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "flutter"
          git clone --depth 1 --branch $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git $root
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $root "bin")
          & (Join-Path $root "bin\flutter.bat") --version

      # Keyed on the pinned URLs, so changing them fetches fresh archives.
      - uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ matrix.platform }}-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Build the Windows package
        shell: pwsh
        run: |
          ./scripts/package-gui-windows.ps1 `
            -OutDir dist `
            -Platform ${{ matrix.platform }} `
            -DownloadFfmpeg `
            -FfmpegUrl "${{ env[matrix.ffmpeg] }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  cli:
    name: Command line
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install the cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip

      - name: Fetch the media tools
        run: |
          curl -sSL --fail -o ffmpeg.zip "$FFMPEG_X64_URL"
          unzip -q ffmpeg.zip -d ffmpeg

      - name: Build the package
        run: |
          ./scripts/package.sh \
            --target x86_64-pc-windows-gnu \
            --with-ffmpeg "$(echo ffmpeg/*/bin)"

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*.zip
          if-no-files-found: error

  android:
    name: Android
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          # A cached copy of the toolchain comes back without its compiler,
          # so the download is repeated on every run instead.
          local-cache: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the conversion engine
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -P 29 \
            -o gui/android/app/src/main/jniLibs build --release

      - name: Restore the media tools
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: gui/android/app/src/main/jniLibs/arm64-v8a/libff*.so
          key: android-ffmpeg-${{ hashFiles('scripts/build-android-ffmpeg.sh') }}

      - name: Install the tools the media build needs
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm cmake ninja-build meson nasm pkg-config

      - name: Build the media tools
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash scripts/build-android-ffmpeg.sh

      - name: Build the application
        working-directory: gui
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Name the package
        run: |
          mkdir -p dist
          cp gui/build/app/outputs/flutter-apk/app-release.apk \
            dist/MyVidComp-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish
    needs: [windows, cli, android]
    # Only a tag publishes. Starting this workflow by hand builds everything
    # and leaves the packages as run artifacts, which is how the packaging is
    # rehearsed without announcing a release.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Each package carries checksums for the files inside it; this one covers
      # the downloads themselves.
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
