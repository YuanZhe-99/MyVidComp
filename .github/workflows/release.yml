name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.2"
  # BtbN's rolling build of the FFmpeg 9.0 series. Their dated builds are
  # removed after a few months, which stops any release that points at one.
  FFMPEG_X64_URL: "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip"
  FFMPEG_ARM64_URL: "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-winarm64-gpl-9.0.zip"

jobs:
  windows:
    name: Windows (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Flutter builds a Windows application only for the machine it runs on,
        # so each package is built on a runner of its own architecture.
        include:
          - platform: x64
            os: windows-2025
          - platform: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        if: matrix.platform == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # The published Windows archive is x64 and carries an x64 Dart, which
      # makes the tool believe it is on an x64 machine and build an x64
      # application. A clone fetches the halves that match the machine it is
      # sitting on, which is what lets an Arm runner build an Arm package.
      - name: Install Flutter for Arm
        if: matrix.platform == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\flutter\bin"

      - name: Build the package
        shell: pwsh
        run: |
          ./scripts/package-gui-windows.ps1 -OutDir dist `
            -Platform ${{ matrix.platform }} -DownloadFfmpeg -FfmpegUrl `
            "${{ matrix.platform == 'x64' && env.FFMPEG_X64_URL || env.FFMPEG_ARM64_URL }}"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.platform }}
          path: dist/*.zip

  cli:
    name: Command line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install the cross compiler
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 zip

      - name: Fetch the media tools
        run: |
          curl -sSL --fail --retry 5 --retry-all-errors -o ffmpeg.zip \
            "$FFMPEG_X64_URL"
          unzip -q ffmpeg.zip -d ffmpeg

      - name: Build the package
        run: |
          ./scripts/package.sh --target x86_64-pc-windows-gnu \
            --with-ffmpeg "$(echo ffmpeg/*/bin)"

      - uses: actions/upload-artifact@v7
        with:
          name: cli
          path: dist/*.zip

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          # A cached copy of the toolchain comes back without its compiler,
          # so the download is repeated on every run instead.
          local-cache: false

      - name: Build the conversion engine
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -P 29 \
            -o gui/android/app/src/main/jniLibs build --release

      # The media tools take far longer to build than everything else here, and
      # they change only when the build script pins new versions.
      - name: Restore the media tools
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: gui/android/app/src/main/jniLibs/arm64-v8a/libff*.so
          key: android-ffmpeg-${{ hashFiles('scripts/build-android-ffmpeg.sh') }}

      - name: Build the media tools
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm cmake ninja-build meson nasm pkg-config
          bash scripts/build-android-ffmpeg.sh

      - name: Build the package
        working-directory: gui
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Name the package
        run: |
          mkdir -p dist
          cp gui/build/app/outputs/flutter-apk/app-release.apk \
            dist/MyVidComp-android-arm64.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*.apk

  # Only a tag publishes. Started by hand, the workflow builds every package
  # and stops, leaving them as run artifacts.
  release:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, cli, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The tag and the crate agree
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match crate version $version."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Each package carries checksums for the files inside it; this one covers
      # the downloads themselves.
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
