name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anywhere; the release workflow asks for more.
permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  # Pinned so a Flutter release never changes the build under us.
  FLUTTER_VERSION: "3.44.2"

jobs:
  engine:
    name: Conversion engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2025 rather than windows-latest: the newer image is missing
        # the Arm64 build tools the release packaging needs, so both workflows
        # stay on the image that has them.
        os: [ubuntu-latest, windows-2025]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      # Several tests only run when the media tools are present, so install
      # them rather than let those tests quietly skip.
      - uses: FedericoCarboni/setup-ffmpeg@v3
        continue-on-error: true

      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  interface:
    name: Interface
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Checks
        working-directory: gui
        run: |
          flutter pub get
          dart format --set-exit-if-changed lib test
          flutter analyze
          flutter test

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # Must match the version Flutter pins, so the engine and the application
      # agree on memory page alignment.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          # A cached copy of the toolchain comes back without its compiler,
          # so the download is repeated on every run instead.
          local-cache: false

      - name: Build the conversion engine
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -P 29 \
            -o gui/android/app/src/main/jniLibs build --release

      # The media tools take far longer to build than everything else here, and
      # they change only when the build script pins new versions.
      - name: Restore the media tools
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: gui/android/app/src/main/jniLibs/arm64-v8a/libff*.so
          key: android-ffmpeg-${{ hashFiles('scripts/build-android-ffmpeg.sh') }}

      - name: Build the media tools
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm cmake ninja-build meson nasm pkg-config
          bash scripts/build-android-ffmpeg.sh

      - name: Build the package
        working-directory: gui
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --target-platform android-arm64

      - name: The engine and the media tools are inside the package
        run: |
          listing=$(unzip -l gui/build/app/outputs/flutter-apk/app-release.apk)
          for library in libmyvidcomp_core.so libffmpeg.so libffprobe.so; do
            echo "$listing" | grep "lib/arm64-v8a/$library"
          done

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Both languages describe the same thing
        shell: pwsh
        run: ./scripts/check-doc-parity.ps1

      - name: No references to the old name remain
        run: |
          # The deliberate exceptions name the constant, and the comment on it,
          # that still recognise files an older install left behind.
          matches=$(grep -rn --include='*.rs' --include='*.dart' \
            --include='*.toml' --include='*.yaml' -i 'pvac' src gui/lib \
            Cargo.toml | grep -viE 'legacy|previous' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "The old project name is still present in the sources above."
            exit 1
          fi
